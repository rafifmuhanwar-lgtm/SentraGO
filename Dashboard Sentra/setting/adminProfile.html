<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile - SentraGO</title>

    <link rel="stylesheet" href="../style.css">

</head>


<script>

if(!localStorage.getItem("adminLogin")){

    window.location.href="../login.html";

}

</script>



<body>


<!-- Sidebar -->

<div class="sidebar">


    <div class="logo">
        SentraGO
        <span>Admin</span>
    </div>



    <ul>


        <a href="../dashboard.html" style="text-decoration:none;color:white;">
            <li>
                🏠 Dashboard
            </li>
        </a>



        <a href="../user.html" style="text-decoration:none;color:white;">
            <li>
                👤 User
            </li>
        </a>



        <a href="../driver.html" style="text-decoration:none;color:white;">
            <li>
                🚗 Driver
            </li>
        </a>



        <a href="../order.html" style="text-decoration:none;color:white;">
            <li>
                📦 Pesanan
            </li>
        </a>



        <a href="../reports.html" style="text-decoration:none;color:white;">
            <li>
                📈 Laporan
            </li>
        </a>



        <li class="active">
            ⚙ Pengaturan
        </li>


    </ul>


</div>





<!-- Main -->

<div class="main">



<header>


    <div>

        <h2>
            Settings
        </h2>


        <p>
            Kelola informasi akun administrator SentraGO.
        </p>


    </div>



    <button class="btn-save">

        Simpan Perubahan

    </button>


</header>







<div class="settings-container">





<!-- Settings Menu -->

<div class="settings-menu">



    <a href="adminProfile.html">

        <button class="setting-item active">

            👤 Profil Admin

        </button>

    </a>





    <a href="access.html">

        <button class="setting-item">

            🔑 Akses Admin

        </button>

    </a>





    <a href="security.html">

        <button class="setting-item">

            🔐 Keamanan

        </button>

    </a>





    <a href="notification.html">

        <button class="setting-item">

            🔔 Notifikasi

        </button>

    </a>





    <a href="database.html">

        <button class="setting-item">

            💾 Database

        </button>

    </a>



</div>









<!-- Content -->


<div class="settings-content">



    <h2>
        Profil Administrator
    </h2>



    <p style="color:#777;margin-bottom:25px;">

        Informasi akun yang memiliki akses ke sistem monitoring SentraGO.

    </p>







    <!-- Foto Profil -->


    <div class="profile-photo">


        <img 
            src="../img/admin.png"
            alt="Admin"
        >



        <button class="btn-upload">

            Ganti Foto

        </button>


    </div>









    <div class="form-group">


        <label>
            Nama Admin
        </label>


        <input 
            type="text"
            value="Administrator"
        >


    </div>









    <div class="form-group">


        <label>
            Email Perusahaan
        </label>


        <input
            type="email"
            value="admin@sentrago.id"
        >


    </div>









    <div class="form-group">


        <label>
            Nomor Telepon
        </label>


        <input
            type="text"
            value="081234567890"
        >


    </div>









    <div class="form-group">


        <label>
            Role
        </label>


        <input
            type="text"
            value="Super Admin"
            readonly
        >


    </div>









    <div class="form-group">


        <label>
            Status Akun
        </label>


        <input
            type="text"
            value="Aktif"
            readonly
        >


    </div>









    <div class="form-group">


        <label>
            Login Terakhir
        </label>


        <input
            type="text"
            value="25 Juli 2026 - 20:15"
            readonly
        >


    </div>








</div>






</div>





</div>



</body>


</html>
