<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - SentraGO</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <div class="logo">

                SentraGO

                <span>
                    Admin
                </span>

            </div>



            <h2>
                Login Admin
            </h2>


            <p>
                Masuk untuk mengakses dashboard monitoring SentraGO.
            </p>



            <form id="loginForm">


                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input 
                        type="email"
                        id="email"
                        placeholder="Masukkan email admin">

                </div>




                <div class="input-group">

                    <label>
                        Password
                    </label>


                    <input 
                        type="password"
                        id="password"
                        placeholder="Masukkan password">

                </div>




                <button type="submit">

                    Login

                </button>



                <p id="message"></p>


            </form>



        </div>



    </div>




<script src="js/auth.js"></script>


</body>

</html>
