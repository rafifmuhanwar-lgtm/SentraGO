name: courier_app
description: "SentraGO Courier App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.1.0
  go_router: ^17.2.3
  dio: ^5.10.0
  appwrite: ^16.1.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_web_auth_2: ^3.1.2
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/courier_icon.png"
  adaptive_icon_background: "#7F1D3A"
  adaptive_icon_foreground: "assets/icon/courier_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

dependency_overrides:
  flutter_web_auth_2: 5.0.3
